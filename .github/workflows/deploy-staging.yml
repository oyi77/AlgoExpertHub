name: Deploy to Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo, ctype, json, openssl

      - name: Install dependencies
        run: |
          cd main
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate --ansi

      - name: Run PHPUnit Tests
        run: |
          cd main
          php artisan test --stop-on-failure

      - name: Run PHPStan Static Analysis
        run: |
          cd main
          ./vendor/bin/phpstan analyse --memory-limit=1G

  deploy:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.STAGING_DEPLOY_SERVER }} >> ~/.ssh/known_hosts

      - name: Create deployment configuration
        env:
          DEPLOY_SERVER: ${{ secrets.STAGING_DEPLOY_SERVER }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          APP_URL: ${{ secrets.STAGING_APP_URL }}
        run: |
          cat > deploy.config.staging << EOF
          DEPLOY_SERVER="${DEPLOY_SERVER}"
          DEPLOY_USER="${DEPLOY_USER}"
          DEPLOY_PATH="${DEPLOY_PATH}"
          SSH_KEY_PATH="$HOME/.ssh/id_rsa"

          APP_NAME="AlgoExpertHub-Staging"
          APP_URL="${APP_URL}"
          APP_DEBUG=true
          LOG_LEVEL="debug"

          DB_DATABASE="algoexpert_staging"
          DB_USERNAME="algoexpert"
          DB_PASSWORD="staging_password"
          DB_ROOT_PASSWORD="staging_root_password"

          REDIS_PASSWORD="null"

          PUSHER_APP_ID="app-id-staging"
          PUSHER_APP_KEY="app-key-staging"
          PUSHER_APP_SECRET="app-secret-staging"
          PUSHER_APP_CLUSTER="mt1"
          PUSHER_WS_HOST="socket-staging.${APP_URL#https://}"

          MAIL_MAILER="smtp"
          MAIL_HOST="mailhog"
          MAIL_PORT="1025"
          MAIL_USERNAME="null"
          MAIL_PASSWORD="null"
          MAIL_ENCRYPTION="null"
          MAIL_FROM_ADDRESS="noreply@${APP_URL#https://}"

          OCTANE_HTTPS=false
          RUN_MIGRATIONS=true
          RUN_SEEDERS=false
          AUTO_CONFIRM=true

          APP_PORT=8000
          NGINX_HTTP_PORT=80
          NGINX_HTTPS_PORT=443

          APP_KEY=""
          EOF

      - name: Run deployment script
        run: |
          chmod +x scripts/deployment/deploy.sh
          ./scripts/deployment/deploy.sh staging
