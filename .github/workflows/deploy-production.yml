name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_SERVER }} >> ~/.ssh/known_hosts
      
      - name: Create deployment configuration
        env:
          DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_URL: ${{ secrets.APP_URL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          PUSHER_WS_HOST: ${{ secrets.PUSHER_WS_HOST }}
        run: |
          cat > deploy.config.production << EOF
          DEPLOY_SERVER="${DEPLOY_SERVER}"
          DEPLOY_USER="${DEPLOY_USER}"
          DEPLOY_PATH="${DEPLOY_PATH}"
          SSH_KEY_PATH="$HOME/.ssh/id_rsa"
          
          APP_NAME="AlgoExpertHub"
          APP_URL="${APP_URL}"
          APP_DEBUG=false
          LOG_LEVEL="warning"
          
          DB_DATABASE="algoexpert"
          DB_USERNAME="algoexpert"
          DB_PASSWORD="${DB_PASSWORD}"
          DB_ROOT_PASSWORD="${DB_ROOT_PASSWORD}"
          
          REDIS_PASSWORD="null"
          
          PUSHER_APP_ID="app-id"
          PUSHER_APP_KEY="app-key"
          PUSHER_APP_SECRET="app-secret"
          PUSHER_APP_CLUSTER="mt1"
          PUSHER_WS_HOST="${PUSHER_WS_HOST}"
          
          MAIL_MAILER="smtp"
          MAIL_HOST="${MAIL_HOST}"
          MAIL_PORT="587"
          MAIL_USERNAME="${MAIL_USERNAME}"
          MAIL_PASSWORD="${MAIL_PASSWORD}"
          MAIL_ENCRYPTION="tls"
          MAIL_FROM_ADDRESS="noreply@${APP_URL#https://}"
          
          OCTANE_HTTPS=true
          RUN_MIGRATIONS=true
          RUN_SEEDERS=false
          AUTO_CONFIRM=true
          
          APP_PORT=8000
          NGINX_HTTP_PORT=80
          NGINX_HTTPS_PORT=443
          
          APP_KEY=""
          EOF
      
      - name: Run deployment script
        run: |
          chmod +x scripts/deployment/deploy.sh
          ./scripts/deployment/deploy.sh production
      
      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment to production ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
