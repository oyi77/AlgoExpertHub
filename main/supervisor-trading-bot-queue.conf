[program:trading-bot-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=docker exec 1Panel-php8-mrTy php /var/www/html/artisan queue:work redis --queue=trading-bots --sleep=3 --tries=1 --timeout=0 --max-jobs=1000 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=3
user=root
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/trading-bot-queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=30
